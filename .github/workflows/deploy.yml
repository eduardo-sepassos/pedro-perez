name: Deploy to S3 + CloudFront

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  S3_BUCKET: landing-pages-sites
  S3_PREFIX: pedro-perez
  CLOUDFRONT_DISTRIBUTION_ID: E1NADZ9JYXW355
  AWS_REGION: sa-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    # PRs only run the build job; the site is synced and invalidated on push to master.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets (long cache)
        run: |
          aws s3 sync dist s3://$S3_BUCKET/$S3_PREFIX --delete --exclude "*.html" --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML (short cache)
        run: |
          aws s3 sync dist s3://$S3_BUCKET/$S3_PREFIX --exclude "*" --include "*.html" --cache-control "public, max-age=60"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/$S3_PREFIX/*"
